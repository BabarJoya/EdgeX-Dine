name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    name: Database (migrations, lint, RLS tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Supabase CLI comes from package-lock.json: same version as local dev.
      - run: npm ci
      - run: npx supabase db start
      - run: npx supabase db lint --level warning --fail-on warning
      # Supabase security + performance advisors (RLS, exposed functions, policies…)
      - run: npx supabase db advisors --level warn --fail-on warn
      - run: npx supabase test db

  e2e:
    name: End-to-end (real Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start Supabase (database, auth, API, storage, realtime)
        run: npx supabase start -x studio,imgproxy,vector,logflare,edge-runtime,supavisor,mailpit
      - name: Point the app at local Supabase
        run: |
          eval "$(npx supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          echo "VITE_SUPABASE_URL=$API_URL" > .env.local
          echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY" >> .env.local
          # Server-only (local test stack): lets /api functions and the test gateway run.
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> .env.local
          echo "ENABLE_TEST_GATEWAY=1" >> .env.local
          echo "VITE_TEST_GATEWAY=1" >> .env.local
          echo "WHATSAPP_API_BASE=http://localhost:4173/api/test/whatsapp" >> .env.local
          echo "FISCAL_API_BASE=http://localhost:4173/api/test/fiscal" >> .env.local
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
